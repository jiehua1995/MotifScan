name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    name: Checks (fmt / clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Rustfmt check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Tests intentionally skipped per maintainer request; CI will only format/lint and build artifacts when releasing.

  build:
    name: Build artifacts
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Determine version
        id: get_version
        shell: bash
        run: |
          VERSION=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build release
        run: cargo build --release
      - name: Package artifact (Linux/Mac)
        if: runner.os != 'Windows' && github.event_name == 'push' && contains(github.event.head_commit.message || '', 'release')
        run: |
          mkdir -p release
          PLAT=linux
          if [ "${{ runner.os }}" = "macOS" ]; then PLAT=macos; fi
          tar -czf release/motifscan-${VERSION}-${PLAT}.tar.gz -C target/release motifscan
          sha256sum release/motifscan-${VERSION}-${PLAT}.tar.gz > release/motifscan-${VERSION}-${PLAT}.sha256
      - name: Package artifact (Windows)
        if: runner.os == 'Windows' && github.event_name == 'push' && contains(github.event.head_commit.message || '', 'release')
        shell: powershell
        run: |
          $env:VERSION = "$env:VERSION"
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path target\release\motifscan.exe -DestinationPath release\motifscan-${env:VERSION}-windows.zip
          $hash = (Get-FileHash -Algorithm SHA256 "release\\motifscan-${env:VERSION}-windows.zip").Hash
          $hash | Out-File -Encoding utf8 "release\\motifscan-${env:VERSION}-windows.sha256"
      - name: Upload build artifact
        if: github.event_name == 'push' && contains(github.event.head_commit.message || '', 'release')
        uses: actions/upload-artifact@v4
        with:
          name: motifscan-${{ env.VERSION }}-${{ matrix.os }}
          path: release/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message || '', 'release')
    steps:
      - uses: actions/checkout@v4
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(awk -F\" '/^version =/ {print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: motifscan-${{ steps.get_version.outputs.version }}-ubuntu-latest
          path: artifacts/linux

      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: motifscan-${{ steps.get_version.outputs.version }}-macos-latest
          path: artifacts/macos

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: motifscan-${{ steps.get_version.outputs.version }}-windows-latest
          path: artifacts/windows

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/linux/*
            artifacts/macos/*
            artifacts/windows/*
