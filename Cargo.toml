[package]
name = "motifscan"
version = "0.1.8"
edition = "2021"
authors = ["Jie Hua <fdjiehua@gmail.com>"]
description = "A fast, streaming, low-memory CLI and Rust library for exact DNA motif scanning in FASTA and FASTQ files."
license = "MIT"
readme = "README.md"
repository = "https://github.com/jiehua1995/MotifScan"
homepage = "https://github.com/jiehua1995/MotifScan"

keywords = [ 
    "bioinformatics", 
    "genomics", 
    "motif", 
    "fasta", 
    "fastq" 
    ] 

categories = [ 
    "command-line-utilities", 
    "science" 
    ]


exclude = [
    ".github/**",
    ".gitignore",
    "doc/agent.md",
    "doc/benchmark.sh",
    "doc/logo.af",
    "doc/logo.png",
]

[lib]
name = "motifscan"
path = "src/lib.rs"

[[bin]]
name = "motifscan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
memchr = "2.7"
rayon = "1.10"
csv = "1.3"
num_cpus = "1.16"
indicatif = "0.17"
aho-corasick = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
codegen-units = 1
lto = true
strip = true